<h1>投射</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Projection</span></p>
<p class="lead">把自己的情绪或特点归于别人。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/psychoanalysis/">经典精神分析</a></dd><dt>通俗地说</dt><dd>把自己不愿承认的情绪或特质，看作是别人的。</dd><dt>例子</dt><dd>自己嫉妒同事，却总觉得同事在嫉妒自己。</dd><dt>常见误用</dt><dd>常被滥用为“你说我如何，其实是你自己如何”的辩论手段。</dd></dl>
