<h1>反刍思维</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Rumination</span></p>
<p class="lead">反复咀嚼同一个问题而没有进展。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/cognitive-therapies/">认知取向治疗</a></dd><dt>通俗地说</dt><dd>重复地想自己的不幸、原因与后果，却不去解决，与抑郁和焦虑密切相关。</dd><dt>例子</dt><dd>失眠的夜晚反复想“为什么我这么差”。</dd><dt>常见误用</dt><dd>不等于“认真思考”：反刍让人更沮丧，而问题解决让人进步。</dd></dl>
