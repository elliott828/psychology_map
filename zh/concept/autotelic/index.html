<h1>自成目的的活动</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Autotelic Activity</span></p>
<p class="lead">活动本身就是奖励。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/flow/">心流</a></dd><dt>通俗地说</dt><dd>做一件事本身就让人满足，不需要额外的外部理由。</dd><dt>例子</dt><dd>下棋、弹琴、爬山，有人愿意花几个小时，只是因为它本身令人投入。</dd><dt>常见误用</dt><dd>并非所有“有趣”的事都是自成目的，需要挑战与能力相配。</dd></dl>
