<h1>情结</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Complex</span></p>
<p class="lead">围绕一类情绪经验聚集的无意识心理丛。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/analytical-psychology/">分析心理学</a></dd><dt>通俗地说</dt><dd>带着强烈情绪的记忆与想法聚集成团，一碰到相关刺激就被触发。</dd><dt>例子</dt><dd>被严厉对待过的人，一遇到权威人物就紧张。</dd><dt>常见误用</dt><dd>日常说的“某某情结”常被泛化成“爱好”，与原义不同。</dd></dl>
