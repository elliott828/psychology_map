<h1>塑造</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Shaping</span></p>
<p class="lead">逐步奖励接近目标的小进步。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/operant/">操作性条件作用</a></dd><dt>通俗地说</dt><dd>先奖励任何朝向目标的行为，再逐渐提高标准，最终形成完整的新行为。</dd><dt>例子</dt><dd>教孩子系鞋带：先奖励拿起鞋带，再奖励交叉，再奖励打结。</dd><dt>常见误用</dt><dd>常被滥用为“只要奖励就行”，忽略了孩子自身的动机与兴趣。</dd></dl>
