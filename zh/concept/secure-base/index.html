<h1>安全基地</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Secure Base</span></p>
<p class="lead">孩子以照顾者为出发点去探索。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/attachment/">依恋理论</a></dd><dt>通俗地说</dt><dd>孩子知道遇到困难时可以回到照顾者身边，因而敢于离开去探索世界。</dd><dt>例子</dt><dd>一岁的孩子在公园玩，会时不时回头看妈妈一眼，再跑开去玩。</dd><dt>常见误用</dt><dd>被误解成“时刻黏着”：安全依恋的孩子反而更敢于独立。</dd></dl>
