<h1>刻板印象</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Stereotype</span></p>
<p class="lead">对一类人的简化概括。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/social-cognition/">社会认知</a></dd><dt>通俗地说</dt><dd>把关于某个群体的特征概括，用于推断其中每一个人。</dd><dt>例子</dt><dd>认为“理科生都不善交际”，遇到某个理科生时先入为主。</dd><dt>常见误用</dt><dd>不是“有偏见才会有”，它是人类认知省力的副产品，但会造成不公平的判断。</dd></dl>
