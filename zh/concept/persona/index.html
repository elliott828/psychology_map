<h1>人格面具</h1>
<p class="sub">概念<span class="sep">·</span><span lang="en">Persona</span></p>
<p class="lead">在社会里呈现给别人的角色。</p><dl class="kv"><dt>所属学派</dt><dd><a href="../../../zh/school/analytical-psychology/">分析心理学</a></dd><dt>通俗地说</dt><dd>为适应社会期待而戴上的“面具”，如职业角色、礼貌的自我。</dd><dt>例子</dt><dd>在公司里稳重专业，回到家才露出幽默放松的一面。</dd><dt>常见误用</dt><dd>它不是“虚伪”，而是正常的社会适应，问题是与它过度认同，忘了自己。</dd></dl>
