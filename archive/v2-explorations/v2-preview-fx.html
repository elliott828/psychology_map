<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychologymap v2 预览 · 强视效</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05070c; --raise:#0e1420;
  --ink:#eaf0f8; --ink2:#a9b6ca; --mute:#6c7890;
  --line:rgba(150,190,255,.14); --line2:rgba(150,190,255,.3);
  --accent:#7df0e2; --accent2:#6aa8ff;
  --sans:"Inter","SF Pro Text",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;overflow:hidden;display:grid;grid-template-rows:58px 46px minmax(0,1fr)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:is(button,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* atmosphere */
#bgfx,.aurora,.scan{position:fixed;inset:0;pointer-events:none}
#bgfx{z-index:0;width:100%;height:100%}
.aurora{z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:780px;height:420px;left:52%;top:-220px;background:rgba(57,135,229,.5)}
.aurora i:nth-child(2){width:620px;height:360px;left:-160px;bottom:-200px;background:rgba(125,240,226,.26);animation-duration:34s;animation-direction:alternate-reverse}
.aurora i:nth-child(3){width:520px;height:320px;right:-140px;bottom:-140px;background:rgba(144,133,233,.3);animation-duration:30s}
@keyframes drift{to{transform:translate(90px,50px) scale(1.15)}}
.scan{z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* bars */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:20px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(5,7,12,.6);backdrop-filter:blur(16px)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.7}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-size:18px;font-weight:700;letter-spacing:.01em;background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035);outline:0;transition:box-shadow .2s,border-color .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,240,226,.12),0 0 24px rgba(125,240,226,.18)}
.search::before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--mute)}
.results{position:absolute;top:40px;left:0;right:0;max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:10px;background:var(--raise);display:none;z-index:20;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.results.open{display:block}
.results button{display:flex;gap:10px;align-items:center;width:100%;min-height:40px;padding:6px 12px;text-align:left}
.results button:hover,.results button:focus-visible{background:rgba(255,255,255,.06)}
.results small{margin-left:auto;color:var(--mute);font-family:var(--mono);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:32px;padding:0 13px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(125,240,226,.14);color:var(--accent);box-shadow:inset 0 0 18px rgba(125,240,226,.18);text-shadow:0 0 12px rgba(125,240,226,.6)}
.seg button:disabled{color:var(--mute);cursor:not-allowed;opacity:.55}
.sub{position:relative;z-index:4;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap;overflow-x:auto;scrollbar-width:none;background:rgba(5,7,12,.35)}
.sub::-webkit-scrollbar{display:none}
.sub label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-right:-8px}
.sub .seg button{min-height:28px;font-size:12px}
.link{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;gap:14px;margin-left:auto;color:var(--mute)}
.legend i{display:inline-block;width:22px;height:0;border-top:1.5px solid var(--ink2);vertical-align:middle;margin-right:5px}
.legend i.b{border-top-style:dashed}.legend i.c{border-top-style:dotted;border-top-width:2px}
.legend b{display:inline-block;width:8px;height:8px;border:1.5px solid var(--accent);border-radius:50%;vertical-align:middle;margin-right:5px}
.legend b.r{border-radius:0;transform:rotate(45deg);border-color:var(--ink2)}

/* stage */
main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden auto}
#ridge,#glass{position:absolute;inset:0;width:100%;height:100%;display:block}
#glass{touch-action:pan-y;cursor:grab}#glass.drag{cursor:grabbing}
body[data-view="ridge"] :is(#glass,#glassSide,#intro),body[data-view="glass"] :is(#ridge,#cards){display:none}
#cards{display:none}
.hud{position:absolute;inset:10px;pointer-events:none;z-index:3}
.hud::before,.hud::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--accent);opacity:.55}
.hud::before{left:0;top:0;border-right:0;border-bottom:0}.hud::after{right:0;bottom:0;border-left:0;border-top:0}
.hud span{position:absolute;right:26px;bottom:2px;font:10.5px var(--mono);letter-spacing:.14em;color:var(--mute)}
#glassSide{position:absolute;left:24px;top:22px;display:grid;gap:2px;z-index:4}
#glassSide button{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 10px 0 6px;border-radius:6px;font-size:13px;color:var(--ink2)}
#glassSide button:hover,#glassSide button.on{background:rgba(255,255,255,.07);color:var(--ink)}
#glassSide i,.chip{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
#intro{position:absolute;left:26px;bottom:26px;z-index:4;max-width:320px}
#intro h1{margin:0 0 8px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:.01em;text-shadow:0 0 30px rgba(125,240,226,.35)}
#intro p{margin:0 0 16px;color:var(--ink2);font-size:13.5px}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-weight:600;background:rgba(125,240,226,.08);box-shadow:0 0 0 0 rgba(125,240,226,.5),inset 0 0 22px rgba(125,240,226,.14);animation:breathe 2.6s ease-in-out infinite}
.cta:hover{background:rgba(125,240,226,.18)}
@keyframes breathe{50%{box-shadow:0 0 34px 2px rgba(125,240,226,.28),inset 0 0 22px rgba(125,240,226,.2)}}

/* svg marks */
.axis line{stroke:var(--line)}
.axis text{fill:var(--mute);font:11px var(--mono)}
.zone-t{fill:var(--accent);font:10.5px var(--mono);letter-spacing:.16em}
.tname{fill:var(--ink);font-size:14px;font-weight:600}
.tq{fill:var(--mute);font-size:11.5px}
.row{transition:opacity .2s}
.sch{cursor:pointer}
.sch .d{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.sch.em .d{stroke:var(--accent)}
.sch .pulse{fill:none;stroke:var(--accent);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.sch:hover .d,.sch.on .d{stroke:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.lab{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none;transition:opacity .2s}
.lab.em{fill:var(--ink2)}
#marks,#labels{transition:opacity .6s}
svg.revealing :is(#marks,#labels){opacity:0}
svg.focus .row:not(.rel){opacity:.22}
svg.focus .sch:not(.rel),svg.focus .lab:not(.rel){opacity:.14}
.edge{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.75}
.edge.borrow{stroke-dasharray:6 5}.edge.oppose{stroke-dasharray:1.5 5;stroke-width:2;stroke-linecap:round}
.flow{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 22;animation:flow 1s linear infinite;filter:drop-shadow(0 0 5px var(--accent))}
@keyframes flow{to{stroke-dashoffset:-24}}
.etag{fill:var(--accent);font:11px var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.cross line{stroke:var(--accent);opacity:.5}.cross text{fill:var(--accent);font:11px var(--mono)}

#tip{position:fixed;z-index:60;max-width:300px;padding:10px 13px;border:1px solid var(--line2);border-radius:8px;background:rgba(14,20,32,.96);pointer-events:none;display:none;font-size:12.5px;box-shadow:0 0 30px rgba(106,168,255,.18)}
#tip b{display:block;font-size:13.5px}#tip span{color:var(--ink2)}#tip em{font-style:normal;font-family:var(--mono);color:var(--accent);margin-right:6px}

/* panel */
#panel{width:0;overflow:hidden;border-left:1px solid var(--line);background:rgba(8,12,20,.82);backdrop-filter:blur(18px);transition:width .22s;position:relative}
#panel.open{width:352px;box-shadow:-30px 0 60px rgba(0,0,0,.35)}
#panel::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:1px;background:linear-gradient(var(--accent),transparent 60%)}
.pin{width:352px;height:100%;overflow:auto;padding:20px 20px 28px}
.pin h2{margin:6px 0 2px;font-size:23px;font-weight:700;line-height:1.25}
.pin .meta{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;flex-wrap:wrap}
.pin .x{float:right;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;color:var(--ink2)}
.pin .lm{margin:14px 0;padding:11px 13px;border-left:2px solid var(--c);background:linear-gradient(90deg,rgba(255,255,255,.06),transparent);border-radius:0 8px 8px 0}
.pin .lm em{font-style:normal;font-family:var(--mono);color:var(--accent);margin-right:8px}
.pin h3{margin:22px 0 8px;font:10.5px var(--mono);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.score{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.score i{display:inline-block;width:14px;height:4px;margin-right:3px;border-radius:2px;background:var(--line2)}.score i.f{background:var(--ink);box-shadow:0 0 8px rgba(255,255,255,.5)}
.badge{display:inline-block;padding:1px 9px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:11.5px}
.rel{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.rel:hover b{color:var(--accent)}
.rel u{grid-row:span 2;align-self:start;margin-top:2px;padding:1px 7px;border:1px solid var(--line2);border-radius:999px;font:11px var(--mono);text-decoration:none;color:var(--ink2);white-space:nowrap}
.rel b{font-weight:600}.rel span{color:var(--ink2);font-size:12.5px}
.note{margin-top:18px;font-size:12px;color:var(--mute)}
#how{position:absolute;z-index:25;left:22px;top:8px;width:min(430px,calc(100vw - 44px));padding:16px 18px;border:1px solid var(--line2);border-radius:12px;background:rgba(14,20,32,.97);display:none;font-size:13px;color:var(--ink2);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#how.open{display:block}#how b{color:var(--ink)}#how p{margin:0 0 9px}#how p:last-child{margin:0;color:var(--mute);font-size:12px}

@media (max-width:760px){
  body{grid-template-rows:auto auto minmax(0,1fr)}
  .bar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}.brand span{display:none}.search{order:3;flex:1 0 100%;max-width:none}
  .bar .seg{margin-left:auto}.bar .seg button{min-height:34px;padding:0 10px}
  .sub{padding:8px 14px;gap:12px}.legend{display:none}
  main{grid-template-columns:1fr}
  body[data-view="ridge"] #ridge{display:none}
  body[data-view="ridge"] #cards{display:block;padding:6px 14px 90px}
  #glassSide,.hud span{display:none}
  #intro{left:16px;right:16px;bottom:14px;max-width:none;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(5,7,12,.72);backdrop-filter:blur(10px)}
  #intro h1{font-size:20px;margin-bottom:4px}#intro p{font-size:12.5px;margin-bottom:10px}
  .card{border-bottom:1px solid var(--line)}
  .card>button{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;min-height:76px;padding:12px 0 0;text-align:left}
  .card>button b{font-size:15px;font-weight:600}.card>button small{grid-column:2/4;color:var(--mute);font-size:12px}
  .card>button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .card svg{grid-column:1/4;width:100%;height:34px;display:block;margin-top:4px;filter:drop-shadow(0 0 5px var(--c))}
  .card.src>button{min-height:56px;padding-bottom:10px}
  .stops{display:none;margin:4px 0 14px 4px;border-left:2px solid var(--c)}.card.open .stops{display:block}
  .stop{display:grid;grid-template-columns:52px 1fr;gap:0 8px;width:100%;min-height:48px;padding:8px 0 8px 12px;text-align:left}
  .stop em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
  .stop b{font-weight:600}.stop span{grid-column:2;color:var(--ink2);font-size:12.5px}
  .stop u{grid-column:2;justify-self:start;margin-top:4px;padding:1px 8px;border:1px solid var(--line2);border-radius:999px;font-size:11.5px;color:var(--ink2);text-decoration:none}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:0;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;z-index:55;transition:height .22s}
  #panel.open{width:auto;height:72vh}.pin{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<canvas id="bgfx"></canvas><div class="aurora"><i></i><i></i><i></i></div><div class="scan"></div>
<header class="bar">
  <div class="brand"><b>Psychologymap</b><span>v2 preview · fx</span></div>
  <div class="search"><input id="q" type="search" placeholder="搜索学派或源头，例如 依恋、斯多葛、DSM" autocomplete="off" aria-label="搜索"><div id="results" class="results"></div></div>
  <div class="seg" role="group" aria-label="读法"><button aria-pressed="true">脉络</button><button disabled title="等正式数据完成后制作">结构</button><button disabled title="等正式数据完成后制作">人物</button></div>
</header>
<div class="sub">
  <label>视图</label>
  <div class="seg" role="group" aria-label="视图"><button data-view="glass" aria-pressed="true">时间沙漏</button><button data-view="ridge" aria-pressed="false">群山</button></div>
  <button class="link" id="howBtn" aria-expanded="false">高度怎么算？</button>
  <div class="legend"><span><b class="r"></b>源头</span><span><b></b>进行中</span><span><i></i>发展 · 分支 · 汇流</span><span><i class="b"></i>桥接 · 流入</span><span><i class="c"></i>反动 · 批评</span></div>
</div>
<main>
  <section id="stage" aria-label="心理学思想脉络图">
    <svg id="ridge" role="img" aria-label="九条脉络随时间的活跃度"></svg>
    <canvas id="glass" aria-label="时间沙漏：源头在上，经 1879 年的瓶颈向下分化为九条脉络"></canvas>
    <div class="hud"><span id="hud"></span></div>
    <div id="glassSide"></div>
    <div id="intro"><h1>心理学的时间沙漏</h1><p>两千多年的思想来源在 1879 年收束，之后分化成九条脉络，底部至今没有封口。拖动旋转，点一条脉络或一个节点。</p><button class="cta" id="enter">展开为地图 <span aria-hidden="true">→</span></button></div>
    <div id="cards"></div>
    <div id="how"></div>
  </section>
  <aside id="panel" aria-live="polite"><div class="pin" id="pin"></div></aside>
</main>

cv.addEventListener('pointerleave',()=>{hideTip();st.hover=null});
$('glassSide').innerHTML=threads.map((t,k)=>`<button data-k="${k}" style="--c:${t.color}"><i></i><span>${t.title.zh}</span></button>`).join('');
$('glassSide').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st.thread=threads[k].id;st.rotTarget=-k*STEP;st.auto=false;$('glassSide').querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b));if(RM)frame(0)});

/* ---------- mobile cards ---------- */
function drawCards(){
  const stop=(n)=>{const x=relOf(n.id).filter(e=>byId.get(e.from).thread!==byId.get(e.to).thread||isRoot(n))[0];let tag='';if(x){const out=x.from===n.id,o=byId.get(out?x.to:x.from);tag=`<u>${out?'→':'←'} ${TYPE[x.type][0]} · ${tById.get(o.thread).title.zh} · ${esc(o.title.zh)}</u>`}
    return`<button class="stop" data-id="${n.id}"><em>${isRoot(n)?(n.year<0?'前'+(-n.year):n.year):n.year}</em><b>${esc(n.title.zh)}${em(n)?' <span class="badge">进行中</span>':''}</b><span>${esc(descOf(n))}</span>${tag}</button>`};
  $('cards').innerHTML=`<div class="card src" style="--c:#7df0e2"><button aria-expanded="false"><i class="chip"></i><b>源头</b><em>${roots.length} 个 · 1860 以前</em><small>心理学成为科学之前，这些想法已经存在</small></button><div class="stops">${[...roots].sort((a,b)=>a.year-b.year).map(stop).join('')}</div></div>`+threads.map(t=>{let d='';for(let y=Y0;y<=Y1;y+=2)d+=`${d?'L':'M'}${((y-Y0)/(Y1-Y0)*300).toFixed(1)} ${(34-val(t.id,y)/gmax*31).toFixed(1)}`;const list=byThread[t.id];
    return`<div class="card" style="--c:${t.color}"><button aria-expanded="false"><i class="chip"></i><b>${t.title.zh}</b><em>${list.length} 个 · ${list[0].year}—今</em><small>${t.question.zh}</small><svg viewBox="0 0 300 34" preserveAspectRatio="none"><path d="${d}L300 34L0 34Z" fill="${t.color}" fill-opacity=".25"/><path d="${d}" fill="none" stroke="${t.color}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg></button><div class="stops">${list.map(stop).join('')}</div></div>`}).join('');
  $('cards').querySelectorAll('.card>button').forEach(b=>b.onclick=()=>{const o=b.parentNode.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  $('cards').querySelectorAll('.stop').forEach(b=>b.onclick=()=>lock(b.dataset.id));
}

/* ---------- controls ---------- */
function setView(v){st.view=v;document.body.dataset.view=v;document.querySelectorAll('button[data-view]').forEach(o=>o.setAttribute('aria-pressed',o.dataset.view===v));hideTip();render(true)}
function render(anim){if(mobile())drawCards();if(st.view==='ridge')drawRidge(anim);else{sizeGlass();frame(0)}}
document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('enter').onclick=()=>setView('ridge');
$('how').innerHTML=`<p><b>山峰高度 = 那一年前后，这条脉络里有多少"分量"的学派登场。</b>每个学派只在它登场前后约十来年里计入，按历史影响评分（1–5）折算成权重。</p><p>九条脉络用同一把尺，可以互相比较。在沙漏里，同样的高度变成沿瓶身向侧面隆起的幅度。</p><p><b>2010 年以后</b>的条目标为"进行中"：它们按中等权重计入，不打影响分，因为重要性还需要时间来判断。</p><p>高度来自本图自己的编辑评分，不是论文数或引用数的统计；现在的评分是暂定的。</p>`;
$('howBtn').onclick=e=>{e.stopPropagation();const o=$('how').classList.toggle('open');$('howBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('#how'))$('how').classList.remove('open');if(!e.target.closest('.search'))$('results').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){lock(null);$('how').classList.remove('open');$('results').classList.remove('open')}});
$('q').addEventListener('input',()=>{const q=$('q').value.trim().toLowerCase(),box=$('results');if(!q){box.classList.remove('open');return}
  const m=all.filter(n=>(n.title.zh+descOf(n)+n.id).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=m.length?m.map(n=>`<button data-id="${n.id}"><i class="chip" style="--c:${tById.get(n.thread).color}"></i>${esc(n.title.zh)}<small>${isRoot(n)?'源头':n.year+' · '+tById.get(n.thread).title.zh}</small></button>`).join(''):'<button disabled>骨架里没有匹配的条目</button>';
  box.classList.add('open');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{box.classList.remove('open');lock(b.dataset.id)})});
let lastW=0,lastH=0,wasMobile=mobile();new ResizeObserver(()=>{const s=$('stage'),w=s.clientWidth,h=Math.round(s.getBoundingClientRect().height);if(w===lastW&&h===lastH)return;lastW=w;lastH=h;if(mobile()!==wasMobile){wasMobile=mobile();render(false);return}if(st.view==='ridge')drawRidge(false);else{sizeGlass();frame(0)}}).observe($('stage'));
render(false);requestAnimationFrame(loop);
window.__pm={st,render,lock,frame,setView,sizeGlass};
})();
</script>
</body>
</html>
