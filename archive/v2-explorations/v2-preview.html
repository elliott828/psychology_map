<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychologymap v2 预览</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b11; --surface:#0b0f16; --raise:#111722;
  --ink:#e9eef6; --ink2:#a9b4c6; --mute:#6f7b90;
  --line:rgba(170,196,255,.14); --line2:rgba(170,196,255,.26);
  --accent:#7df0e2;
  --sans:"Inter","SF Pro Text",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;overflow:hidden;
  display:grid;grid-template-rows:56px 46px minmax(0,1fr)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 520px at 72% -12%,rgba(57,135,229,.16),transparent 62%),
    radial-gradient(900px 420px at 8% 112%,rgba(125,240,226,.07),transparent 60%);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 68%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 68%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:is(button,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(8,11,17,.72);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-size:17px;font-weight:650;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03);outline:0}
.search input:focus{border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--mute)}
.results{position:absolute;top:40px;left:0;right:0;max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:10px;background:var(--raise);display:none;z-index:20}
.results.open{display:block}
.results button{display:flex;gap:10px;align-items:center;width:100%;min-height:40px;padding:6px 12px;text-align:left}
.results button:hover,.results button:focus-visible{background:rgba(255,255,255,.06)}
.results small{margin-left:auto;color:var(--mute);font-family:var(--mono);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:32px;padding:0 13px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(125,240,226,.13);color:var(--accent)}
.seg button:disabled{color:var(--mute);cursor:not-allowed;opacity:.55}

/* sub bar */
.sub{position:relative;z-index:4;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-right:-8px}
.sub .seg button{min-height:28px;font-size:12px}
.link{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;gap:14px;margin-left:auto;color:var(--mute)}
.legend i{display:inline-block;width:22px;height:0;border-top:1.5px solid var(--ink2);vertical-align:middle;margin-right:5px}
.legend i.b{border-top-style:dashed}.legend i.c{border-top-style:dotted;border-top-width:2px}

/* stage */
main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden auto}
#ridge,#glass{position:absolute;inset:0;width:100%;height:100%;display:block}
#glass{touch-action:pan-y;cursor:grab}
#glass.drag{cursor:grabbing}
body[data-view="ridge"] #glass,body[data-view="ridge"] #glassSide,body[data-view="glass"] #ridge{display:none}
#cards{display:none}
#glassSide{position:absolute;left:20px;top:18px;display:grid;gap:2px;z-index:2}
#glassSide button{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 10px 0 6px;border-radius:6px;font-size:13px;color:var(--ink2)}
#glassSide button:hover,#glassSide button.on{background:rgba(255,255,255,.07);color:var(--ink)}
#glassSide i,.chip{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
#glassHint{position:absolute;left:20px;bottom:16px;font-size:12px;color:var(--mute);z-index:2;max-width:300px}
body[data-view="ridge"] #glassHint{display:none}

/* svg marks */
.axis line{stroke:var(--line)}
.axis text{fill:var(--mute);font:11px var(--mono)}
.tname{fill:var(--ink);font-size:14px;font-weight:600}
.tq{fill:var(--mute);font-size:11.5px}
.row{transition:opacity .18s}
.sch{cursor:pointer}
.sch circle.d{fill:var(--bg);stroke:var(--ink);stroke-width:1.6;transition:r .15s}
.sch:hover circle.d,.sch.on circle.d{r:5.5;stroke:var(--accent)}
.lab{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none;transition:opacity .18s}
svg.focus .row:not(.rel){opacity:.28}
svg.focus .sch:not(.rel),svg.focus .lab:not(.rel){opacity:.16}
.edge{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.9}
.edge.borrow{stroke-dasharray:6 5}.edge.oppose{stroke-dasharray:1.5 5;stroke-width:2;stroke-linecap:round}
.etag{fill:var(--accent);font:11px var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.cross line{stroke:var(--line2)}.cross text{fill:var(--ink2);font:11px var(--mono)}

/* tooltip */
#tip{position:fixed;z-index:30;max-width:280px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:rgba(17,23,34,.96);pointer-events:none;display:none;font-size:12.5px}
#tip b{display:block;font-size:13.5px}#tip span{color:var(--ink2)}#tip em{font-style:normal;font-family:var(--mono);color:var(--accent);margin-right:6px}

/* panel */
#panel{width:0;overflow:hidden;border-left:1px solid var(--line);background:rgba(11,15,22,.86);backdrop-filter:blur(14px);transition:width .2s}
#panel.open{width:348px}
.pin{width:348px;height:100%;overflow:auto;padding:20px 20px 28px}
.pin h2{margin:6px 0 2px;font-size:22px;font-weight:650;line-height:1.25}
.pin .meta{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px}
.pin .x{position:sticky;float:right;top:0;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;color:var(--ink2)}
.pin .lm{margin:14px 0;padding:11px 13px;border-left:2px solid var(--c);background:rgba(255,255,255,.035);border-radius:0 8px 8px 0}
.pin .lm em{font-style:normal;font-family:var(--mono);color:var(--accent);margin-right:8px}
.pin h3{margin:22px 0 8px;font:10.5px var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.score{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.score i{display:inline-block;width:14px;height:4px;margin-right:3px;border-radius:2px;background:var(--line2)}.score i.f{background:var(--ink)}
.rel{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.rel:hover b{color:var(--accent)}
.rel u{grid-row:span 2;align-self:start;margin-top:2px;padding:1px 7px;border:1px solid var(--line2);border-radius:999px;font:11px var(--mono);text-decoration:none;color:var(--ink2);white-space:nowrap}
.rel b{font-weight:600}.rel span{color:var(--ink2);font-size:12.5px}
.note{margin-top:18px;font-size:12px;color:var(--mute)}

/* popover */
#how{position:absolute;z-index:25;left:20px;top:8px;width:min(430px,calc(100vw - 40px));padding:16px 18px;border:1px solid var(--line2);border-radius:12px;background:rgba(17,23,34,.97);display:none;font-size:13px;color:var(--ink2)}
#how.open{display:block}#how b{color:var(--ink)}#how p{margin:0 0 9px}#how p:last-child{margin:0;color:var(--mute);font-size:12px}

/* mobile */
@media (max-width:760px){
  body{grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
  .bar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}.brand span{display:none}.search{order:3;flex:1 0 100%;max-width:none}
  .bar .seg{margin-left:auto}.bar .seg button{min-height:34px;padding:0 10px}
  .sub{padding:8px 14px;gap:12px}.legend{display:none}
  main{grid-template-columns:1fr}
  #stage{overflow:auto}
  body[data-view="ridge"] #ridge{display:none}
  body[data-view="ridge"] #cards{display:block;padding:6px 14px 90px}
  #glassHint{display:none}
  #glassSide{left:10px;top:8px}#glassSide button{font-size:12px;min-height:26px}#glassSide button span{display:none}
  .card{border-bottom:1px solid var(--line)}
  .card>button{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;min-height:76px;padding:12px 0 0;text-align:left}
  .card>button b{font-size:15px;font-weight:600}.card>button small{grid-column:2/4;color:var(--mute);font-size:12px}
  .card>button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .card svg{grid-column:1/4;width:100%;height:34px;display:block;margin-top:4px}
  .stops{display:none;margin:4px 0 14px 4px;border-left:2px solid var(--c)}.card.open .stops{display:block}
  .stop{display:grid;grid-template-columns:44px 1fr;gap:0 8px;width:100%;min-height:48px;padding:8px 0 8px 12px;text-align:left}
  .stop em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
  .stop b{font-weight:600}.stop span{grid-column:2;color:var(--ink2);font-size:12.5px}
  .stop u{grid-column:2;justify-self:start;margin-top:4px;padding:1px 8px;border:1px solid var(--line2);border-radius:999px;font-size:11.5px;color:var(--ink2);text-decoration:none}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:0;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;z-index:40;transition:height .22s}
  #panel.open{width:auto;height:72vh}.pin{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>
<main>
  <section id="stage" aria-label="心理学思想脉络图">
    <svg id="ridge" role="img" aria-label="九条脉络随时间的活跃度"></svg>
    <canvas id="glass" aria-label="时间沙漏：九条脉络环绕时间轴"></canvas>

    <div id="cards"></div>
    <div id="how"></div>
  </section>
  <aside id="panel" aria-live="polite"><div class="pin" id="pin"></div></aside>
</main>
<div id="tip"></div>

<script>
(function(){
const D=window.PSYMAP_SKELETON, threads=D.threads, schools=D.nodes, edges=D.edges, roots=D.roots;
const byId=new Map(schools.map(s=>[s.id,s])), tById=new Map(threads.map(t=>[t.id,t]));
const byThread={}; threads.forEach(t=>byThread[t.id]=schools.filter(s=>s.thread===t.id).sort((a,b)=>a.year-b.year));
const TYPE={develops:['发展','inherit'],branches:['分支','inherit'],merges:['汇流','inherit'],bridges:['桥接','borrow'],applies:['应用','borrow'],reacts:['反动','oppose'],critiques:['批评','oppose']};
const Y0=1855,Y1=2026,BIRTH=1879,W=[0,.45,.7,1,1.5,2.2];
const st={view:'ridge',h:'births',hover:null,lock:null,thread:null,rot:-.35,auto:true};
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mobile=()=>matchMedia('(max-width:760px)').matches;
const tw=(s,z=12)=>[...s].reduce((a,c)=>a+(c.charCodeAt(0)>255?z:z*.58),0);
const relOf=id=>edges.filter(e=>e.from===id||e.to===id);

/* ---------- height model ---------- */
let series={},gmax=1;
function act(tid,y){let h=0;for(const s of byThread[tid]){const w=W[s.influence],d=y-s.year;
  if(st.h==='births')h+=w*Math.exp(-(d*d)/72); else if(d>=0)h+=w*(1-Math.exp(-d/5))*Math.pow(.5,d/45);}return h}
function compute(){gmax=0;threads.forEach(t=>{const a=[];for(let y=Y0;y<=Y1;y++){const v=act(t.id,y);a.push(v);if(v>gmax)gmax=v}series[t.id]=a})}
const val=(tid,y)=>{const a=series[tid],f=Math.max(0,Math.min(a.length-1.001,y-Y0)),i=Math.floor(f);return a[i]+(a[i+1]-a[i])*(f-i)};

/* ---------- ridge (flat) view ---------- */
let pos={},geo={};
function drawRidge(){
  const svg=$('ridge'),r=$('stage').getBoundingClientRect(),Wd=$('stage').clientWidth,Hd=Math.max(r.height,560);if(Wd<50||mobile())return;svg.style.height=Hd+'px';
  const gut=Wd<1000?168:214,right=30,top=64,bottom=20,pitch=(Hd-top-bottom)/9,amp=pitch*1.45/gmax;
  const x=y=>gut+(y-Y0)/(Y1-Y0)*(Wd-gut-right), base=i=>top+pitch*(i+1)-8;
  geo={x,base,amp,gut,right,top,Wd,Hd};pos={};
  let s=`<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e9eef6"/></marker>${threads.map(t=>`<linearGradient id="g-${t.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.color}" stop-opacity=".5"/><stop offset="1" stop-color="${t.color}" stop-opacity=".03"/></linearGradient>`).join('')}</defs>`;
  s+='<g class="axis">';for(let y=1860;y<=2020;y+=20)s+=`<line x1="${x(y)}" y1="${top-8}" x2="${x(y)}" y2="${Hd-bottom+6}"/><text x="${x(y)}" y="${top-16}" text-anchor="middle">${y}</text>`;
  s+=`<line x1="${x(BIRTH)}" y1="${top-8}" x2="${x(BIRTH)}" y2="${Hd-bottom+6}" stroke-dasharray="2 4" style="stroke:var(--accent);opacity:.5"/><text x="${x(BIRTH)+6}" y="${Hd-bottom+4}" style="fill:var(--accent)">1879 实验室</text></g>`;
  const placed=[];let labels='',marks='';
  threads.forEach((t,i)=>{
    const b=base(i);let d='';for(let y=Y0;y<=Y1;y+=.5)d+=`${d?'L':'M'}${x(y).toFixed(1)} ${(b-val(t.id,y)*amp).toFixed(1)}`;
    const area=`${d}L${x(Y1)} ${b}L${x(Y0)} ${b}Z`;
    s+=`<g class="row" data-t="${t.id}"><path d="${area}" fill="var(--bg)" opacity=".93"/><path d="${area}" fill="url(#g-${t.id})"/><path d="${d}" fill="none" stroke="${t.color}" stroke-width="1.8" stroke-linejoin="round"/><line x1="${gut-14}" y1="${b}" x2="${Wd-right}" y2="${b}" stroke="${t.color}" stroke-opacity=".28"/>
      <g class="tlabel" data-t="${t.id}" tabindex="0" role="button" aria-label="${t.title.zh}"><rect x="8" y="${b-34}" width="${gut-30}" height="40" fill="transparent"/><rect x="18" y="${b-27}" width="9" height="9" rx="2" fill="${t.color}"/><text class="tname" x="34" y="${b-18}">${t.title.zh}</text><text class="tq" x="18" y="${b-2}">${t.question.zh}</text></g></g>`;
    [...byThread[t.id]].sort((a,c)=>c.influence-a.influence||a.year-c.year).forEach(n=>{
      const px=x(n.year),py=b-val(t.id,n.year)*amp;pos[n.id]={x:px,y:py};
      marks+=`<g class="sch" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title.zh)}，${n.year}"><circle r="12" cx="${px}" cy="${py}" fill="transparent"/><circle class="d" r="${n.tier===1?3.6:2.6}" cx="${px}" cy="${py}"/></g>`;
      if(n.tier!==1)return;const w=tw(n.title.zh)+8,rc=[px-w/2,py-23,px+w/2,py-7];
      if(rc[0]<gut-6||rc[2]>Wd-4||placed.some(p=>rc[0]<p[2]&&rc[2]>p[0]&&rc[1]<p[3]&&rc[3]>p[1]))return;
      placed.push(rc);labels+=`<text class="lab" data-id="${n.id}" x="${px}" y="${py-10}" text-anchor="middle">${esc(n.title.zh)}</text>`;
    });
  });
  svg.setAttribute('viewBox',`0 0 ${Wd} ${Hd}`);
  svg.innerHTML=s+`<g id="marks">${marks}</g><g id="labels">${labels}</g><g id="edges"></g><g class="cross" id="cross" style="display:none"><line y1="${top-8}" y2="${Hd-bottom}"/><text y="${top-30}" text-anchor="middle"></text></g>`;
  svg.querySelectorAll('.sch').forEach(g=>{const id=g.dataset.id;
    g.addEventListener('mouseenter',e=>{st.hover=id;focusRidge();showTip(id,e)});g.addEventListener('mousemove',e=>moveTip(e));
    g.addEventListener('mouseleave',()=>{st.hover=null;focusRidge();hideTip()});g.addEventListener('focus',()=>{st.hover=id;focusRidge()});g.addEventListener('blur',()=>{st.hover=null;focusRidge()});
    g.addEventListener('click',e=>{e.stopPropagation();lock(id)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();lock(id)}})});
  svg.querySelectorAll('.tlabel').forEach(g=>{const id=g.dataset.t;const on=()=>{st.thread=id;focusRidge()},off=()=>{st.thread=null;focusRidge()};
    g.addEventListener('mouseenter',on);g.addEventListener('mouseleave',off);g.addEventListener('focus',on);g.addEventListener('blur',off)});
  focusRidge();
}
function focusRidge(){
  const svg=$('ridge'),id=st.hover||st.lock,eg=svg.querySelector('#edges');if(!eg)return;
  let list=[],relN=new Set(),relT=new Set();
  if(id){list=relOf(id);relN.add(id);list.forEach(e=>{relN.add(e.from);relN.add(e.to)});relN.forEach(n=>relT.add(byId.get(n).thread))}
  else if(st.thread){relT.add(st.thread);list=edges.filter(e=>(byId.get(e.from).thread===st.thread)!==(byId.get(e.to).thread===st.thread));list.forEach(e=>{relN.add(e.from);relN.add(e.to)});byThread[st.thread].forEach(n=>relN.add(n.id));relN.forEach(n=>relT.add(byId.get(n).thread))}
  const on=relN.size>0;svg.classList.toggle('focus',on);
  svg.querySelectorAll('.row').forEach(g=>g.classList.toggle('rel',relT.has(g.dataset.t)));
  svg.querySelectorAll('.sch').forEach(g=>{g.classList.toggle('rel',relN.has(g.dataset.id));g.classList.toggle('on',g.dataset.id===id)});
  svg.querySelectorAll('#labels .lab').forEach(g=>g.classList.toggle('rel',relN.has(g.dataset.id)));
  let h='';const shown=new Set([...svg.querySelectorAll('#labels .lab')].map(l=>l.dataset.id));
  list.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;const dx=(b.x-a.x)*.5,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    h+=`<path class="edge ${TYPE[e.type][1]}" marker-end="url(#arr)" d="M${a.x} ${a.y}C${a.x+dx} ${a.y},${b.x-dx} ${b.y},${b.x} ${b.y}"/>`;
    if(id)h+=`<text class="etag" x="${mx}" y="${my-5}" text-anchor="middle">${TYPE[e.type][0]}</text>`});
  if(id)relN.forEach(n=>{if(shown.has(n))return;const p=pos[n];h+=`<text class="lab rel" x="${p.x}" y="${p.y-10}" text-anchor="middle">${esc(byId.get(n).title.zh)}</text>`});
  eg.innerHTML=h;
}
$('ridge').addEventListener('mousemove',e=>{const c=$('ridge').querySelector('#cross');if(!c||!geo.x)return;const r=$('ridge').getBoundingClientRect(),px=e.clientX-r.left;
  if(px<geo.gut||px>geo.Wd-geo.right){c.style.display='none';return}const yr=Math.round(Y0+(px-geo.gut)/(geo.Wd-geo.gut-geo.right)*(Y1-Y0));
  c.style.display='';c.querySelector('line').setAttribute('x1',px);c.querySelector('line').setAttribute('x2',px);const t=c.querySelector('text');t.setAttribute('x',px);t.textContent=yr});
$('ridge').addEventListener('mouseleave',()=>{const c=$('ridge').querySelector('#cross');if(c)c.style.display='none'});
$('ridge').addEventListener('click',()=>lock(null));

/* ---------- tooltip ---------- */
function showTip(id,e){const n=byId.get(id),t=tById.get(n.thread),k=relOf(id).length;$('tip').innerHTML=`<b>${esc(n.title.zh)}</b><span><em>${n.year}</em>${esc(n.landmark.zh)}</span><br><span><i class="chip" style="--c:${t.color}"></i> ${t.title.zh}${k?` · ${k} 条关系`:''}</span>`;$('tip').style.display='block';moveTip(e)}
function moveTip(e){const t=$('tip'),w=t.offsetWidth,h=t.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;t.style.left=x+'px';t.style.top=y+'px'}
function hideTip(){$('tip').style.display='none'}

/* ---------- detail panel ---------- */
function lock(id){st.lock=id;const p=$('panel');
  if(!id){p.classList.remove('open');after();return}
  const n=byId.get(id),t=tById.get(n.thread),rs=relOf(id);
  $('pin').innerHTML=`<button class="x" id="px" aria-label="关闭">×</button><div class="meta"><i class="chip" style="--c:${t.color}"></i>${t.title.zh}</div><h2>${esc(n.title.zh)}</h2>
   <div class="lm" style="--c:${t.color}"><em>${n.year}</em>${esc(n.landmark.zh)}</div>
   <div class="score">历史影响 <span>${[1,2,3,4,5].map(i=>`<i class="${i<=n.influence?'f':''}"></i>`).join('')}</span><span class="mono">${n.influence}/5 暂定</span></div>
   <h3>关系 · ${rs.length}</h3>${rs.length?rs.map(e=>{const out=e.from===id,o=byId.get(out?e.to:e.from),ot=tById.get(o.thread);return`<button class="rel" data-go="${o.id}"><u>${out?'→ ':'← '}${TYPE[e.type][0]}</u><b><i class="chip" style="--c:${ot.color}"></i> ${esc(o.title.zh)} <span class="mono">${o.year}</span></b><span>${esc(e.note.zh)}</span></button>`}).join(''):'<p class="note">骨架里暂时没有它的跨脉络关系；正式数据会补上脉络内部的关系。</p>'}
   <p class="note">这是骨架数据：只有学派、标志事件和关键的跨脉络关系。理论、人物、概念卡片和阅读阶梯在正式数据完成后出现在这里。${n.confidence!=='high'?'<br>⚠ 这一条的年份把握较低，待核对。':''}</p>`;
  p.classList.add('open');$('px').onclick=()=>lock(null);$('pin').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>lock(b.dataset.go));
  st.rotTarget=-threads.findIndex(x=>x.id===n.thread)*Math.PI*2/9;st.auto=false;after();
}
function after(){setTimeout(()=>{if(st.view==='ridge')drawRidge();else{sizeGlass();drawGlass()}},mobile()?0:230);focusRidge()}

/* ---------- hourglass (3D) view ---------- */
const cv=$('glass'),cx2=cv.getContext('2d');let gw=0,gh=0,hits=[];
function sizeGlass(){const r=$('stage').getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);gw=$('stage').clientWidth;gh=Math.max(r.height,mobile()?480:560);cv.style.height=gh+'px';cv.width=gw*d;cv.height=gh*d;cx2.setTransform(d,0,0,d,0,0)}
function drawGlass(){
  if(st.view!=='glass'||gw<50)return;const c=cx2;c.clearRect(0,0,gw,gh);
  const top=44,tilt=.3,cx=gw/2+(gw>900?40:0),Rm=Math.min(gw*.38,420,(gh-top-50)*.5),bot=gh-50-Rm*tilt,neck=top+(bot-top)*.27,Rn=Rm*.09,Rt=Rm*.6;
  const yOf=y=>neck+(y-BIRTH)/(Y1-BIRTH)*(bot-neck);
  const R=y=>y>=neck?Rn+(Rm-Rn)*Math.pow(Math.sin(Math.min(1,(y-neck)/(bot-neck))*Math.PI/2),.85):Rn+(Rt-Rn)*Math.pow(Math.sin(Math.min(1,(neck-y)/(neck-top))*Math.PI/2),1.1);
  const P=(th,y,r)=>({x:cx+r*Math.sin(th),y:y+r*Math.cos(th)*tilt,z:Math.cos(th)});
  const ink='233,238,246',step=Math.PI*2/9,arcMax=step*.86;
  const ring=(y,front,a)=>{c.beginPath();c.ellipse(cx,y,R(y),R(y)*tilt,0,front?0:Math.PI,front?Math.PI:Math.PI*2);c.strokeStyle=`rgba(${ink},${a})`;c.lineWidth=1;c.stroke()};
  const years=[1880,1900,1920,1940,1960,1980,2000,2020];
  years.forEach(y=>ring(yOf(y),false,.07));ring(top,false,.12);
  // glass silhouette
  c.beginPath();for(let y=top;y<=bot;y+=3)c.lineTo(cx-R(y),y);for(let y=bot;y>=top;y-=3)c.lineTo(cx+R(y),y);c.closePath();
  const gf=c.createLinearGradient(0,top,0,bot);gf.addColorStop(0,'rgba(125,240,226,.05)');gf.addColorStop(.25,'rgba(125,240,226,.015)');gf.addColorStop(1,'rgba(57,135,229,.06)');c.fillStyle=gf;c.fill();c.strokeStyle=`rgba(${ink},.2)`;c.lineWidth=1;c.stroke();
  // roots on the upper bulb
  roots.forEach((rt,i)=>{const th=st.rot*.6+i*Math.PI*2/roots.length+.5,y0=top+8+(i%3)*((neck-top)*.2);c.beginPath();for(let y=y0;y<=neck;y+=3){const p=P(th,y,R(y));y===y0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y)}const z=Math.cos(th);c.strokeStyle=`rgba(125,240,226,${z>0?.42:.1})`;c.lineWidth=1;c.stroke();
    if(z>.1){const p=P(th,y0,R(y0));c.fillStyle=`rgba(125,240,226,${.5+z*.5})`;c.fillRect(p.x-2.5,p.y-2.5,5,5);c.font='12px '+getComputedStyle(document.body).fontFamily;c.fillStyle=`rgba(${ink},${.45+z*.5})`;c.textAlign=p.x<cx?'right':'left';c.fillText(rt.title.zh,p.x+(p.x<cx?-9:9),p.y+4)}});
  // threads, back to front
  hits=[];const names=[];const order=threads.map((t,k)=>({t,k,th:st.rot+k*step})).sort((a,b)=>Math.cos(a.th)-Math.cos(b.th)),labels=[];
  order.forEach(({t,th})=>{const z=Math.cos(th),a=.16+.84*Math.pow((z+1)/2,1.6),first=byThread[t.id][0].year;
    const basePts=[],ridgePts=[];for(let yr=BIRTH;yr<=Y1;yr+=1){const y=yOf(yr),r=R(y),d=Math.min(arcMax,val(t.id,yr)/gmax*Rm*.5/r);basePts.push(P(th,y,r));ridgePts.push(P(th+d,y,r))}
    c.beginPath();basePts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));for(let i=ridgePts.length-1;i>=0;i--)c.lineTo(ridgePts[i].x,ridgePts[i].y);c.closePath();
    c.globalAlpha=a*.3;c.fillStyle=t.color;c.fill();c.globalAlpha=a;
    c.beginPath();ridgePts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle=t.color;c.lineWidth=st.thread===t.id?2.6:1.7;c.stroke();
    c.beginPath();basePts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.globalAlpha=a*.4;c.lineWidth=1;c.stroke();c.globalAlpha=1;
    byThread[t.id].forEach(n=>{if(n.year<BIRTH)return;const y=yOf(n.year),r=R(y),d=Math.min(arcMax,val(t.id,n.year)/gmax*Rm*.5/r),p=P(th+d,y,r);
      if(z>-.1){c.beginPath();c.arc(p.x,p.y,n.tier===1?3.2:2,0,7);c.fillStyle='#080b11';c.globalAlpha=a;c.fill();c.strokeStyle=n.id===(st.hover||st.lock)?'#7df0e2':`rgb(${ink})`;c.lineWidth=1.4;c.stroke();c.globalAlpha=1;hits.push({id:n.id,x:p.x,y:p.y})}
      if(n.tier===1&&z>.25)labels.push({n,p,z,inf:n.influence})});
    names.push({t,e:P(th,bot,R(bot)),z,a});
  });
  {const np=[];c.font='600 13px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';names.sort((p,q)=>q.z-p.z).forEach(({t,e,z,a})=>{if(z<-.2)return;c.fillStyle=t.color;c.globalAlpha=a;c.fillRect(e.x-4,e.y+6,8,8);c.globalAlpha=1;const w=tw(t.title.zh,13)+10,rc=[e.x-w/2,e.y+12,e.x+w/2,e.y+32];if(rc[0]<2||rc[2]>gw-2||np.some(q=>rc[0]<q[2]&&rc[2]>q[0]&&rc[1]<q[3]&&rc[3]>q[1]))return;np.push(rc);c.fillStyle=`rgba(${ink},${Math.max(.3,a)})`;c.fillText(t.title.zh,e.x,e.y+27)})}
  years.forEach(y=>{ring(yOf(y),true,.17);c.font='11px ui-monospace,Consolas,monospace';c.textAlign='right';c.fillStyle=`rgba(${ink},.45)`;c.fillText(y,cx-R(yOf(y))-10,yOf(y)+4)});ring(bot,true,.3);ring(neck,true,.5);ring(top,true,.22);
  // neck callout
  c.strokeStyle='rgba(125,240,226,.6)';c.beginPath();c.moveTo(cx+Rn+6,neck);c.lineTo(cx+Rn+54,neck);c.stroke();c.textAlign='left';c.fillStyle='#7df0e2';c.font='11px ui-monospace,Consolas,monospace';c.fillText('1879',cx+Rn+60,neck-3);c.fillStyle=`rgba(${ink},.8)`;c.font='12px '+getComputedStyle(document.body).fontFamily;c.fillText('心理学成为实验科学',cx+Rn+60,neck+13);
  c.textAlign='center';c.fillStyle=`rgba(${ink},.5)`;c.font='11px ui-monospace,Consolas,monospace';c.fillText('源头 · 1860 以前',cx,top-12);
  // school labels: front first, then by influence
  const put=[[cx+Rn+50,neck-18,cx+Rn+66+tw('心理学成为实验科学'),neck+20]];c.font='12px '+getComputedStyle(document.body).fontFamily;
  labels.sort((a,b)=>(b.z>.75)-(a.z>.75)||b.inf-a.inf||b.z-a.z).forEach(({n,p,z})=>{const w=tw(n.title.zh)+6,left=p.x<cx,rc=[left?p.x-8-w:p.x+8,p.y-8,left?p.x-8:p.x+8+w,p.y+8];
    if(rc[0]<4||rc[2]>gw-4||put.some(q=>rc[0]<q[2]&&rc[2]>q[0]&&rc[1]<q[3]&&rc[3]>q[1]))return;put.push(rc);
    c.textAlign=left?'right':'left';c.lineWidth=4;c.strokeStyle=`rgba(8,11,17,${.5+z*.4})`;c.strokeText(n.title.zh,left?p.x-8:p.x+8,p.y+4);c.fillStyle=`rgba(${ink},${.35+.65*z})`;c.fillText(n.title.zh,left?p.x-8:p.x+8,p.y+4)});
}
function loop(){if(st.view==='glass'){if(st.rotTarget!=null){let d=st.rotTarget-st.rot;d=Math.atan2(Math.sin(d),Math.cos(d));if(Math.abs(d)<.004){st.rot=st.rotTarget;st.rotTarget=null}else st.rot+=d*.12;drawGlass()}else if(st.auto&&!matchMedia('(prefers-reduced-motion:reduce)').matches){st.rot+=.0016;drawGlass()}}requestAnimationFrame(loop)}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,rot:st.rot,moved:false};st.auto=false;st.rotTarget=null;cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x;if(Math.abs(dx)>3)drag.moved=true;st.rot=drag.rot+dx*.008;drawGlass();hideTip();return}
  const r=cv.getBoundingClientRect(),h=nearest(e.clientX-r.left,e.clientY-r.top);if((h&&h.id)!==st.hover){st.hover=h?h.id:null;drawGlass()}if(h){showTip(h.id,e);cv.style.cursor='pointer'}else{hideTip();cv.style.cursor=''}});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(drag&&!drag.moved){const r=cv.getBoundingClientRect(),h=nearest(e.clientX-r.left,e.clientY-r.top);lock(h?h.id:null)}drag=null});
cv.addEventListener('pointerleave',()=>{hideTip();if(st.hover){st.hover=null;drawGlass()}});
function nearest(x,y){let best=null,bd=mobile()?22:13;for(let i=hits.length-1;i>=0;i--){const h=hits[i],d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
$('glassSide').innerHTML=threads.map((t,k)=>`<button data-k="${k}" style="--c:${t.color}"><i></i><span>${t.title.zh}</span></button>`).join('');
$('glassSide').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st.thread=threads[k].id;st.rotTarget=-k*Math.PI*2/9;st.auto=false;$('glassSide').querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b))});

/* ---------- mobile cards ---------- */
function drawCards(){
  $('cards').innerHTML=threads.map(t=>{let d='';for(let y=Y0;y<=Y1;y+=2)d+=`${d?'L':'M'}${((y-Y0)/(Y1-Y0)*300).toFixed(1)} ${(34-val(t.id,y)/gmax*31).toFixed(1)}`;
    const list=byThread[t.id];return`<div class="card" style="--c:${t.color}"><button aria-expanded="false"><i class="chip"></i><b>${t.title.zh}</b><em>${list.length} 个 · ${list[0].year}—</em><small>${t.question.zh}</small><svg viewBox="0 0 300 34" preserveAspectRatio="none"><path d="${d}L300 34L0 34Z" fill="${t.color}" fill-opacity=".22"/><path d="${d}" fill="none" stroke="${t.color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></button>
    <div class="stops">${list.map(n=>{const x=relOf(n.id).filter(e=>byId.get(e.from).thread!==byId.get(e.to).thread)[0];let tag='';if(x){const out=x.from===n.id,o=byId.get(out?x.to:x.from);tag=`<u>${out?'→':'←'} ${TYPE[x.type][0]} · ${tById.get(o.thread).title.zh} · ${esc(o.title.zh)}</u>`}
      return`<button class="stop" data-id="${n.id}"><em>${n.year}</em><b>${esc(n.title.zh)}</b><span>${esc(n.landmark.zh)}</span>${tag}</button>`}).join('')}</div></div>`}).join('');
  $('cards').querySelectorAll('.card>button').forEach(b=>b.onclick=()=>{const o=b.parentNode.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  $('cards').querySelectorAll('.stop').forEach(b=>b.onclick=()=>lock(b.dataset.id));
}

/* ---------- controls ---------- */
function render(){compute();if(mobile())drawCards();if(st.view==='ridge')drawRidge();else{sizeGlass();drawGlass()}}
document.querySelectorAll('[data-view]').forEach(b=>b.tagName==='BUTTON'&&(b.onclick=()=>{st.view=b.dataset.view;document.body.dataset.view=st.view;document.querySelectorAll('button[data-view]').forEach(o=>o.setAttribute('aria-pressed',o===b));render()}));
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{st.h=b.dataset.h;document.querySelectorAll('[data-h]').forEach(o=>o.setAttribute('aria-pressed',o===b));render()});
$('how').innerHTML=`<p><b>山峰高度 = 那一年前后，这条脉络里有多少"分量"的学派。</b>每个学派按历史影响评分（1–5）折算成权重，影响越大的学派把山顶得越高。</p><p><b>新学派涌现</b>：一个学派只在它登场前后约十来年里计入。看的是"什么时候热闹"，比如行为主义的 1910—1960。</p><p><b>累计分量</b>：学派登场后持续计入，每 45 年衰减一半。看的是"到那时已经积累了多少"。</p><p>九条脉络用同一把尺，可以互相比较高低。高度来自本图自己的编辑评分，不是论文数或引用数的统计；现在的评分是暂定的。</p>`;
$('howBtn').onclick=e=>{e.stopPropagation();const o=$('how').classList.toggle('open');$('howBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('#how'))$('how').classList.remove('open');if(!e.target.closest('.search'))$('results').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){lock(null);$('how').classList.remove('open');$('results').classList.remove('open')}});
$('q').addEventListener('input',()=>{const q=$('q').value.trim().toLowerCase(),box=$('results');if(!q){box.classList.remove('open');return}
  const m=schools.filter(n=>(n.title.zh+n.landmark.zh+n.id).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=m.length?m.map(n=>`<button data-id="${n.id}"><i class="chip" style="--c:${tById.get(n.thread).color}"></i>${esc(n.title.zh)}<small>${n.year} · ${tById.get(n.thread).title.zh}</small></button>`).join(''):'<button disabled>骨架里没有匹配的学派</button>';
  box.classList.add('open');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{box.classList.remove('open');lock(b.dataset.id)})});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,80)});
render();requestAnimationFrame(loop);
window.__pm={st,render,lock,drawGlass,sizeGlass};
})();
